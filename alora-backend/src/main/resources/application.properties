server.port=8080

# Spring Application
spring.application.name=alora-backend

# =============================================================
# Database Configuration
# Default: File-backed persistent database in ./data/alora_db (Runs instantly, zero setup required)
# =============================================================
spring.datasource.url=jdbc:h2:file:./data/alora_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.open-in-view=false

# =============================================================
# To switch to your local MySQL 8.0 Server:
# 1. Comment the H2 properties above
# 2. Uncomment the 4 MySQL properties below and enter your MySQL root password:
# =============================================================
# spring.datasource.url=jdbc:mysql://localhost:3306/alora_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
# spring.datasource.username=root
# spring.datasource.password=YOUR_MYSQL_PASSWORD
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Alora ML Service Endpoint
alora.ml-service.base-url=http://127.0.0.1:8001
alora.ml-service.enabled=true

# Logging
logging.level.com.alora=INFO
logging.level.org.springframework.web=INFO
